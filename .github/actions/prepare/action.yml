name: Prepare Swift build
description: >-
  Selects an Xcode with Swift 6.3+ and the macOS 26 SDK, restores (or builds)
  tools/whisper.xcframework (whisper.cpp + llama.cpp on one shared ggml) and
  restores the SwiftPM .build cache.
  Shared by ci.yml and release.yml so both run the same steps.

inputs:
  xcode-app:
    description: Xcode to select. Falls back to the image default if missing.
    required: false
    default: /Applications/Xcode_26.6.app

runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      env:
        XCODE_APP: ${{ inputs.xcode-app }}
      run: .github/scripts/select-xcode.sh "${XCODE_APP}"

    - name: Resolve whisper.cpp and llama.cpp commits
      id: whisper
      shell: bash
      run: |
        script=scripts/build-whisper-xcframework.sh
        whisper="$(sed -n 's/^WHISPER_COMMIT="\([0-9a-f]*\)".*/\1/p' "${script}")"
        llama="$(sed -n 's/^LLAMA_COMMIT="\([0-9a-f]*\)".*/\1/p' "${script}")"
        if [[ -z "${whisper}" || -z "${llama}" ]]; then
          echo "::error::WHISPER_COMMIT or LLAMA_COMMIT not found in ${script}"
          exit 1
        fi
        echo "commit=${whisper:0:12}-${llama:0:12}" >> "${GITHUB_OUTPUT}"

    - name: Cache whisper.xcframework
      id: whisper-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: tools/whisper.xcframework
        key: whisper-xcframework-${{ runner.os }}-${{ runner.arch }}-${{ steps.whisper.outputs.commit }}-${{ hashFiles('scripts/build-whisper-xcframework.sh') }}

    - name: Build whisper.xcframework
      if: steps.whisper-cache.outputs.cache-hit != 'true'
      shell: bash
      run: scripts/build-whisper-xcframework.sh

    - name: Cache SwiftPM .build
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .build
        # The xcframework's version is part of the key: a .build made against other whisper/llama headers fails with
        # "ggml.h has been modified since the module file ... was built"
        key: spm-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.AUTONOTE_XCODE_VERSION }}-${{ steps.whisper.outputs.commit }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**') }}
        restore-keys: |
          spm-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.AUTONOTE_XCODE_VERSION }}-${{ steps.whisper.outputs.commit }}-
