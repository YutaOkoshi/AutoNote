name: CI

# macOS ランナーの時間を節約するため push は main だけ。開発ブランチは PR を開いたときに走る
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# 同じブランチ（PR）の古い実行は取り消す。macOS ランナーの時間を節約するため
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # macOS 26 (arm64, 標準ランナー)。Xcode 26.6 / Swift 6.3 / macOS 26 SDK
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/prepare

      - name: Build
        run: swift build

      - name: Test (retry once on failure)
        run: .github/scripts/swift-test-retry.sh
