name: Release

# main に push されたとき、Resources/Info.plist の CFBundleShortVersionString に対応する
# v<version> のタグが無ければ、ビルド・テストして GitHub Release を作る。タグがあれば何もしない。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    # バージョン判定だけなので安い Linux ランナーで済ませる（macOS の約 1/10 の消費）
    # workflow_dispatch を main 以外で起動しても、リリースは main からしか作らない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v5

      - name: Read version and check tag
        id: check
        run: .github/scripts/release-version.sh Resources/Info.plist

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    # 1 ランナーで arm64 + x86_64 のユニバーサル .app を作る（Intel ランナーは使わない）
    runs-on: macos-26
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/prepare

      - name: Build
        run: swift build

      - name: Test (retry once on failure)
        run: .github/scripts/swift-test-retry.sh

      - name: Build universal AutoNote.app (ad-hoc signed)
        env:
          AUTONOTE_BUILD_ARCHS: arm64 x86_64
          AUTONOTE_CODESIGN_IDENTITY: "-"
        run: scripts/build-app.sh release

      - name: Check architectures
        run: |
          for exe in AutoNoteApp autonote; do
            lipo -info "build/AutoNote.app/Contents/MacOS/${exe}"
            lipo "build/AutoNote.app/Contents/MacOS/${exe}" -verify_arch arm64 x86_64
          done

      - name: Zip
        run: ditto -c -k --keepParent build/AutoNote.app "AutoNote-${VERSION}-macos-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoNote-${{ env.VERSION }}-macos-universal
          path: AutoNote-${{ env.VERSION }}-macos-universal.zip
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "AutoNote ${VERSION}" \
            --generate-notes \
            --notes-file .github/release-notes.md \
            "dist/AutoNote-${VERSION}-macos-universal.zip"
